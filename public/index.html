<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>GHOST HACKER: FLOW</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0f1115;
      color: #f2f2f6;
      font-family: -apple-system, "Hiragino Sans", sans-serif;
    }
    .flow-app {
      width: min(560px, 90vw);
      min-height: 280px;
      padding: 2rem;
      border: 1px solid #2a2d36;
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      gap: 1rem;
      background: #161922;
      transition: background 0.2s ease;
    }
    .flow-app h1 { font-size: 1.1rem; margin: 0; letter-spacing: 0.04em; }
    .flow-sub { color: #9096a8; font-size: 0.9rem; margin: 0; }
    .flow-app button {
      padding: 0.7rem 2rem;
      border-radius: 8px;
      border: 1px solid #3a3f4d;
      background: #1e2230;
      color: inherit;
      font-size: 1rem;
      cursor: pointer;
    }
    .flow-app button:hover { background: #2a3040; }
    .flow-countdown { font-size: 3rem; font-weight: 700; letter-spacing: 0.05em; }
    .flow-hud { display: flex; gap: 1.5rem; font-size: 0.9rem; color: #cfd3e0; }
    .flow-judgment { font-size: 1.8rem; font-weight: 700; min-height: 2.2rem; letter-spacing: 0.05em; }
    .flow-hint { color: #7a7f8f; font-size: 0.85rem; margin: 0; }
  </style>
</head>
<body>
  <div id="app"></div>
  <script src="main.js"></script>
</body>
</html>
